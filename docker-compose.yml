services:
  postgres:
    image: postgres:15-alpine
    container_name: genehub-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: genehub
      POSTGRES_PASSWORD: genehub
      POSTGRES_DB: genehub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genehub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
