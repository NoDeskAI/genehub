name: Release

on:
  push:
    tags:
      - "v*"

env:
  CR_REGISTRY: nodesk-center-cn-beijing.cr.volces.com
  CR_IMAGE: nodesk-center-cn-beijing.cr.volces.com/base-image/genehub
  CR_IMAGE_CURATOR: nodesk-center-cn-beijing.cr.volces.com/base-image/genehub-curator

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync VERSION → package.json
        run: node scripts/sync-version.mjs --check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  publish-npm:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Sync VERSION → package.json
        run: node scripts/sync-version.mjs
      - run: pnpm build

      - name: Publish @nodeskai/genehub-types
        run: npm publish --access public --tag latest
        working-directory: packages/types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nodeskai/genehub-sdk
        run: npm publish --access public --tag latest
        working-directory: packages/sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nodeskai/genehub (CLI)
        run: npm publish --access public --tag latest
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-k8s:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from git tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Login to Volcengine CR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CR_REGISTRY }}
          username: ${{ secrets.CR_USERNAME }}
          password: ${{ secrets.CR_PASSWORD }}

      - name: Build and push GeneHub image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: NODE_IMAGE=node:22-alpine
          tags: |
            ${{ env.CR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.CR_IMAGE }}:latest

      - name: Build and push Curator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.curator
          push: true
          platforms: linux/amd64
          build-args: NODE_IMAGE=node:22-alpine
          tags: |
            ${{ env.CR_IMAGE_CURATOR }}:${{ env.IMAGE_TAG }}
            ${{ env.CR_IMAGE_CURATOR }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to K8s
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config

          # Deploy GeneHub main app
          kubectl set image deployment/genehub \
            genehub=${{ env.CR_IMAGE }}:${{ env.IMAGE_TAG }} \
            -n nodeskclaw-system

          kubectl rollout status deployment/genehub \
            -n nodeskclaw-system --timeout=120s

          # Deploy Curator (CronJob + Listener)
          kubectl apply -f deploy/k8s/curator.yaml

          # Update Curator images
          kubectl set image cronjob/gene-curator \
            curator=${{ env.CR_IMAGE_CURATOR }}:${{ env.IMAGE_TAG }} \
            -n nodeskclaw-system || true

          kubectl set image deployment/gene-curator-listener \
            listener=${{ env.CR_IMAGE_CURATOR }}:${{ env.IMAGE_TAG }} \
            -n nodeskclaw-system || true

          kubectl rollout status deployment/gene-curator-listener \
            -n nodeskclaw-system --timeout=120s || true

  github-release:
    needs: [deploy-k8s]
    if: always() && needs.deploy-k8s.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
