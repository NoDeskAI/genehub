name: CI

on:
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genehub
          POSTGRES_PASSWORD: genehub
          POSTGRES_DB: genehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20, 22]

    env:
      DATABASE_URL: postgres://genehub:genehub@localhost:5432/genehub_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check VERSION sync
        run: node scripts/sync-version.mjs --check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run database migrations
        run: pnpm --filter @nodeskai/genehub-registry db:migrate

      - name: Test
        run: pnpm test
