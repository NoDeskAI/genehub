apiVersion: v1
kind: Secret
metadata:
  name: genehub-app-secret
  namespace: nodeskclaw-system
type: Opaque
stringData:
  DATABASE_URL: "postgres://genehub:<CHANGE_ME>@genehub-postgres:5432/genehub"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genehub
  namespace: nodeskclaw-system
  labels:
    app: genehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genehub
  template:
    metadata:
      labels:
        app: genehub
    spec:
      imagePullSecrets:
        - name: cr-nodesk-center-cn-beijing
      containers:
        - name: genehub
          image: nodesk-center-cn-beijing.cr.volces.com/base-image/genehub:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: genehub-app-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: genehub
  namespace: nodeskclaw-system
  labels:
    app: genehub
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: genehub
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genehub-nginx-route
  namespace: nodeskclaw-system
spec:
  ingressClassName: nginx
  rules:
    - host: genehub.nodeskai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: genehub
                port:
                  number: 80
